services:
  01-greenfield-backend:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm
    working_dir: /app
    volumes:
      - ./01-greenfield-backend:/app:z
      - /app/.venv
    command: ["sh", "-c", "uv sync --frozen && uv run uvicorn petclinic.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports:
      - "8000:8000"

  01-greenfield-frontend:
    image: node:22
    working_dir: /app
    volumes:
      - ./01-greenfield-frontend:/app:z
      - /app/node_modules
    command: ["/bin/sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true

networks:
  default:
    driver: bridge
